<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TrueCircle — Matched by lifestyle. Connected by trust.">
  <meta name="theme-color" content="#F06449">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrueCircle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TrueCircle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fafafa;
      color: #222222;
      font-family: Inter, system-ui, sans-serif;
    }

    #truecircle-loading {
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    #truecircle-loading strong {
      font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
    }

    #truecircle-loading p {
      margin: 0;
      color: #717171;
      font-size: 0.95rem;
    }

    .truecircle-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #ebebeb;
      border-top-color: #ff5a5f;
      border-radius: 50%;
      animation: truecircle-spin 0.9s linear infinite;
    }

    @keyframes truecircle-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="truecircle-loading" aria-live="polite" aria-busy="true">
    <div class="truecircle-spinner" aria-hidden="true"></div>
    <strong>TrueCircle</strong>
    <p>Loading marketplace…</p>
  </div>
  <!-- Required by supabase_flutter 2.15+ / passkeys_web on Chrome -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
