name: true_circle
description: TrueCircle — Matched by lifestyle. Connected by trust.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Backend & auth
  supabase_flutter: ^2.12.4
  # Device security (Face ID, fingerprint, device PIN)
  local_auth: ^3.0.1
  # GPS / location for circle proximity features
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  file_picker: ^11.0.2
  ai_barcode_scanner: ^7.1.0
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.4
  web: ^1.1.1
  # Interactive map for location pin-drop
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/Noto_Color_Emoji/NotoColorEmoji-Regular.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/Noto_Color_Emoji/NotoColorEmoji-Regular.ttf
